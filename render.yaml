# Render Blueprint — piloto BotPedidos
# Deploy: conecta el repo en Render y "New +" -> "Blueprint".
# Los secretos marcados `sync: false` se rellenan a mano en el dashboard.

databases:
  - name: botpedidos-db
    databaseName: botpedidos
    plan: basic-256mb          # subir según necesidad
    postgresMajorVersion: "16"

services:
  # ---- App web ----
  - type: web
    name: botpedidos-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # serversideup/php escucha en 8080; Render lo detecta por EXPOSE.
    # Si el health check falla por puerto, añade  envVar  PORT=8080.
    # Migraciones + cache al desplegar. `--force` porque no hay TTY.
    preDeployCommand: >
      php artisan migrate --force &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache
    envVars:
      - key: APP_KEY
        sync: false            # generar con: php artisan key:generate --show
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false            # https://botpedidos-web.onrender.com o tu dominio
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MESSAGING_INBOUND_QUEUE
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: botpedidos-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: botpedidos-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: botpedidos-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: botpedidos-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: botpedidos-db, property: password }
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: ORDER_INGESTION_ENABLED
        value: "true"
      - key: TELEGRAM_VERIFY_SSL
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_BRANCH_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false             # vacío hasta activar WhatsApp
      - key: LEGACY_LOTTERY_ROUTES_ENABLED
        value: "false"
      - key: DEVELOPER_TOOLKIT_ENABLED
        value: "false"
      - key: SENTRY_LARAVEL_DSN
        sync: false              # DSN del proyecto en sentry.io
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

  # ---- Worker de la cola (procesa los mensajes entrantes) ----
  - type: worker
    name: botpedidos-queue
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    dockerCommand: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
    autoDeploy: true
    envVars:
      - fromGroup: botpedidos-shared

  # ---- Poller de Telegram (lee mensajes del bot) ----
  - type: worker
    name: botpedidos-telegram
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    dockerCommand: php artisan telegram:poll --loop --sleep=3
    autoDeploy: true
    envVars:
      - fromGroup: botpedidos-shared

  # ---- Scheduler (no hay tareas programadas todavía; dejar listo) ----
  - type: worker
    name: botpedidos-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    dockerCommand: php artisan schedule:work
    autoDeploy: true
    envVars:
      - fromGroup: botpedidos-shared

# Grupo de variables compartido por worker/poller/scheduler.
# En el dashboard, rellenar los mismos valores que la web (o usar "Link" a env vars).
envVarGroups:
  - name: botpedidos-shared
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: QUEUE_CONNECTION
        value: database
      - key: MESSAGING_INBOUND_QUEUE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: botpedidos-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: botpedidos-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: botpedidos-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: botpedidos-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: botpedidos-db, property: password }
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: ORDER_INGESTION_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_BRANCH_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
